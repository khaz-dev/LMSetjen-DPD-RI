# ==============================================================================
# Apache VirtualHost Configuration for LMSetjen DPD RI - Backend API & Admin
# Domain: lms-be.dpd.go.id
# Mengatasi Temuan Pentest S-01, T-01, dan Standarisasi Header Keamanan
#
# Pasang file ini ke: /etc/apache2/sites-available/lms-be.dpd.go.id.conf
# Lalu aktifkan dengan:
#   sudo a2ensite lms-be.dpd.go.id.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName lms-be.dpd.go.id

    # Paksa Redirect seluruh HTTP ke HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/lms_be_http_error.log
    CustomLog ${APACHE_LOG_DIR}/lms_be_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lms-be.dpd.go.id

    # ==========================================================================
    # SSL Engine Configuration
    # ==========================================================================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/lms-be.dpd.go.id.crt
    SSLCertificateKeyFile /etc/ssl/private/lms-be.dpd.go.id.key
    # SSLCertificateChainFile /etc/ssl/certs/lms_ca_bundle.crt

    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # ==========================================================================
    # 🔒 MANDATORY SECURITY HEADERS (Mengatasi S-01)
    # ==========================================================================
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set X-XSS-Protection "1; mode=block"

    # Batas ukuran upload hingga 500M (untuk SCORM / video materi)
    LimitRequestBody 524288000

    # ==========================================================================
    # 🔒 PROTEKSI MEDIA T-01: Proteksi Berkas Course File & Dokumen Sensitif
    # Mencegah Apache menyajikan berkas media internal secara langsung (bypass auth).
    # Semua request ke /media/ diarahkan ke Django backend (port 8001) yang
    # diverifikasi oleh EnhancedMediaView (Bearer token / Session).
    # Berkas sensitif (course-file, documents, certificates, .pdf, .docx) wajib login.
    # ==========================================================================
    <LocationMatch "^/media/(course-file|documents|certificates)/">
        ProxyPass http://127.0.0.1:8001/media/$1/
        ProxyPassReverse http://127.0.0.1:8001/media/$1/
    </LocationMatch>

    # Blokir akses langsung ke ekstensi berbahaya dalam media jika ada folder statis
    <LocationMatch "\.(php|phtml|php3|php4|php5|phps|cgi|pl|exe|sh|bash|py)$">
        Require all denied
    </LocationMatch>

    # ==========================================================================
    # Reverse Proxy ke Backend Django/Gunicorn (Port 8001 pada 127.0.0.1)
    # ==========================================================================
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/lms_be_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lms_be_ssl_access.log combined
</VirtualHost>
