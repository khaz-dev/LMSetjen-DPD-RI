# ==============================================================================
# Apache VirtualHost Configuration for LMSetjen DPD RI - Frontend
# Domain: lms.dpd.go.id
# Mengatasi Temuan Pentest S-01 (Strict Security Headers: HSTS, CSP, XFO, XCTO)
#
# Pasang file ini ke: /etc/apache2/sites-available/lms.dpd.go.id.conf
# Lalu aktifkan dengan:
#   sudo a2enmod ssl headers rewrite proxy proxy_http
#   sudo a2ensite lms.dpd.go.id.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName lms.dpd.go.id
    ServerAlias www.lms.dpd.go.id

    # Paksa Redirect seluruh HTTP ke HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/lms_http_error.log
    CustomLog ${APACHE_LOG_DIR}/lms_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lms.dpd.go.id
    ServerAlias www.lms.dpd.go.id

    # ==========================================================================
    # SSL Engine Configuration (Gunakan sertifikat SSL resmi DPD RI / Let's Encrypt)
    # ==========================================================================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/lms.dpd.go.id.crt
    SSLCertificateKeyFile /etc/ssl/private/lms.dpd.go.id.key
    # SSLCertificateChainFile /etc/ssl/certs/lms_ca_bundle.crt

    # Protokol & Cipher Suite Modern (TLS 1.2 & TLS 1.3)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # ==========================================================================
    # 🔒 MANDATORY SECURITY HEADERS (Mengatasi Temuan Pentest S-01)
    # Wajib menggunakan 'Header always set' agar berlaku untuk semua kode respons HTTP
    # ==========================================================================
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set X-XSS-Protection "1; mode=block"

    # Content-Security-Policy (CSP) Komprehensif
    Header always set Content-Security-Policy "\
default-src 'self'; \
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; \
font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; \
img-src 'self' data: blob: https: http:; \
media-src 'self' blob: https: http:; \
connect-src 'self' https: http: wss: ws:; \
frame-src 'self' https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self';"

    # Batas ukuran upload hingga 500M (untuk SCORM / video materi)
    LimitRequestBody 524288000

    # 🚀 OPTIMASI PERFORMA & UPLOAD VIDEO/FILE BESAR
    TimeOut 600
    ProxyTimeout 600

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # ==========================================================================
    # 🔗 REVERSE PROXY API KE BACKEND DJANGO (Port 8001) - SOLUSI SINGLE DOMAIN
    # Mengarahkan https://lms.dpd.go.id/api/ langsung ke Django Backend lokal
    # Tidak lagi memerlukan subdomain lms-be.dpd.go.id yang terisolir di internal
    # ==========================================================================
    ProxyPass /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    # ==========================================================================
    # 🔒 PROTEKSI MEDIA T-01: Proteksi Berkas Course File & Dokumen Sensitif
    # Mengarahkan berkas media internal ke Django Backend (EnhancedMediaView)
    # ==========================================================================
    ProxyPass /media/ http://127.0.0.1:8001/media/
    ProxyPassReverse /media/ http://127.0.0.1:8001/media/

    # Blokir akses langsung ke ekstensi berbahaya dalam media
    <LocationMatch "\.(php|phtml|php3|php4|php5|phps|cgi|pl|exe|sh|bash|py)$">
        Require all denied
    </LocationMatch>

    # ==========================================================================
    # Reverse Proxy ke Container Frontend (Port 5174 pada 127.0.0.1)
    # Harus diletakkan PALING BAWAH setelah rule /api/ dan /media/
    # ==========================================================================
    ProxyPass / http://127.0.0.1:5174/
    ProxyPassReverse / http://127.0.0.1:5174/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/lms_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lms_ssl_access.log combined
</VirtualHost>
